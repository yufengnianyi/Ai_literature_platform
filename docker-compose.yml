services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: demo-01-postgres
    environment:
      POSTGRES_DB: demo_01
      POSTGRES_USER: demo_01
      POSTGRES_PASSWORD: demo_01
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_01 -d demo_01"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  grobid:
    image: lfoppiano/grobid:0.8.2
    container_name: demo-01-grobid
    ports:
      - "8070:8070"

  neo4j:
    image: neo4j:5.26.22
    container_name: demo-01-neo4j
    environment:
      NEO4J_AUTH: neo4j/demo_01_graph
    ports:
      - "7474:7474"
      - "7687:7687"
    volumes:
      - neo4j-data:/data

volumes:
  postgres-data:
  neo4j-data:
