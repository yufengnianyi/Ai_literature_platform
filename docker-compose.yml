services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: demo-01-postgres
    environment:
      POSTGRES_DB: demo_01
      POSTGRES_USER: demo_01
      POSTGRES_PASSWORD: demo_01
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U demo_01 -d demo_01"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data: