    rag:
      docs-path: src/main/resources/docs
      bootstrap-mode: ${APP_AI_RAG_BOOTSTRAP_MODE:if-empty}
  web:
    cors:
      allowed-origin-patterns: http://localhost:5173

bigmodel:
  api-key: ${BIGMODEL_API_KEY:}
