spring:
  datasource:
    url: jdbc:postgresql://localhost:55432/demo_01
    username: demo_01
    password: demo_01

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}
      embedding-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}

app:
