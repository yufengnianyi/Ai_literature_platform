spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:55432/demo_01}
    username: ${SPRING_DATASOURCE_USERNAME:demo_01}
    password: ${SPRING_DATASOURCE_PASSWORD:demo_01}
  neo4j:
    uri: ${SPRING_NEO4J_URI:bolt://localhost:7687}
    authentication:
      username: ${SPRING_NEO4J_USERNAME:neo4j}
      password: ${SPRING_NEO4J_PASSWORD:demo_01_graph}

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen3-max-2026-01-23}
        enable-thinking: ${DASHSCOPE_ENABLE_THINKING:false}
        thinking-budget: ${DASHSCOPE_THINKING_BUDGET:81920}
      embedding-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY:}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen3-max-2026-01-23}
        enable-thinking: ${DASHSCOPE_ENABLE_THINKING:false}
        thinking-budget: ${DASHSCOPE_THINKING_BUDGET:81920}

app:
  user:
    init-admin:
      enabled: false
      user-account: admin
      user-password: admin123456
      user-name: Local Admin
  ai:
    preprocessing:
      storage-root: data/rag
      grobid:
        base-url: ${APP_AI_RAG_GROBID_BASE_URL:http://localhost:8070}
    rag:
      storage-root: data/rag
      grobid:
        base-url: ${APP_AI_RAG_GROBID_BASE_URL:http://localhost:8070}
    kg:
      enabled: ${APP_AI_KG_ENABLED:true}
      graph-builder:
        enabled: ${APP_AI_KG_GRAPH_BUILDER_ENABLED:false}
        endpoint: ${APP_AI_KG_GRAPH_BUILDER_ENDPOINT:}
  web:
    cors:
      allowed-origin-patterns: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174

bigmodel:
  api-key: ${BIGMODEL_API_KEY:}
