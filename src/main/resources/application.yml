spring:
  application:
    name: demo_01
  profiles:
    default: local
  flyway:
    out-of-order: true
    ignore-migration-patterns:
      - "*:future"
      - "*:missing"
    placeholders:
      embeddingDimension: ${app.ai.rag.embedding-dimension:1024}
      vectorTable: ${app.ai.rag.vector-table:embedding_store}
  servlet:
    multipart:
      max-file-size: ${APP_UPLOAD_MAX_FILE_SIZE:100MB}
      max-request-size: ${APP_UPLOAD_MAX_REQUEST_SIZE:300MB}

mybatis-flex:
  global-config:
    print-banner: false
    normal-value-of-logic-delete: 0
    deleted-value-of-logic-delete: 1

server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    context-path: /api
    session:
      timeout: ${app.user.session.timeout:24h}
      cookie:
        http-only: true
        max-age: ${app.user.session.timeout:24h}
        same-site: lax

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  user:
    session:
      timeout: 24h
    init-admin:
      enabled: false
      user-account:
      user-password:
      user-name:
  ai:
    memory:
      max-tokens: 4000
    preprocessing:
      storage-root: ${app.ai.rag.storage-root:data/rag}
      async-threads: ${app.ai.rag.async-threads:2}
      version: preprocess-v1
      grobid:
        base-url: ${app.ai.rag.grobid.base-url:http://localhost:8070}
        connect-timeout-ms: ${app.ai.rag.grobid.connect-timeout-ms:5000}
        read-timeout-ms: ${app.ai.rag.grobid.read-timeout-ms:180000}
        max-retries: ${app.ai.rag.grobid.max-retries:2}
        retry-backoff-ms: ${app.ai.rag.grobid.retry-backoff-ms:1000}
      chunking:
        target-tokens: ${app.ai.rag.chunking.target-tokens:700}
        max-tokens: ${app.ai.rag.chunking.max-tokens:900}
        overlap-sentences: ${app.ai.rag.chunking.overlap-sentences:1}
        strategy-version: ${app.ai.rag.chunking.strategy-version:grobid-section-sentence-v1}
    rag:
      embedding-dimension: 1024
      vector-table: embedding_store
      batch-concurrency: 2
      retrieval:
        dense-max-results: ${APP_AI_RAG_RETRIEVAL_DENSE_MAX_RESULTS:15}
        dense-min-score: ${APP_AI_RAG_RETRIEVAL_DENSE_MIN_SCORE:0.6}
        bm25-max-results: ${APP_AI_RAG_RETRIEVAL_BM25_MAX_RESULTS:15}
        fused-max-results: ${APP_AI_RAG_RETRIEVAL_FUSED_MAX_RESULTS:15}
        rrf-k: 60
        bm25-index-path: ${app.ai.rag.retrieval.bm25-index-root:data/bm25-index}
      chat:
        enabled: ${APP_AI_RAG_CHAT_ENABLED:true}
        max-context-chunks: ${APP_AI_RAG_CHAT_MAX_CONTEXT_CHUNKS:5}
        max-excerpt-chars: ${APP_AI_RAG_CHAT_MAX_EXCERPT_CHARS:600}
        max-context-chars: ${APP_AI_RAG_CHAT_MAX_CONTEXT_CHARS:6000}
        rerank:
          enabled: ${APP_AI_RAG_CHAT_RERANK_ENABLED:true}
          model: ${APP_AI_RAG_CHAT_RERANK_MODEL:qwen3-vl-rerank}
          min-score: ${APP_AI_RAG_CHAT_RERANK_MIN_SCORE:0.2}
          input-max-chars: ${APP_AI_RAG_CHAT_RERANK_INPUT_MAX_CHARS:2000}
      evaluation:
        report-root: ${APP_AI_RAG_EVALUATION_REPORT_ROOT:data/rag-evaluation}
        chunk-batch-size: 12
        judgment-max-attempts: ${APP_AI_RAG_EVALUATION_JUDGMENT_MAX_ATTEMPTS:3}
        fts-max-results: ${APP_AI_RAG_EVALUATION_FTS_MAX_RESULTS:100}
        dense-max-results: ${APP_AI_RAG_EVALUATION_DENSE_MAX_RESULTS:300}
        dense-min-score: ${APP_AI_RAG_EVALUATION_DENSE_MIN_SCORE:0.0}
        bm25-max-results: ${APP_AI_RAG_EVALUATION_BM25_MAX_RESULTS:100}
        priority-chunks-per-fts-document: ${APP_AI_RAG_EVALUATION_PRIORITY_CHUNKS_PER_FTS_DOCUMENT:2}
        rrf-k: ${APP_AI_RAG_EVALUATION_RRF_K:60}
        max-documents: ${APP_AI_RAG_EVALUATION_MAX_DOCUMENTS:0}
        entity-enhanced-enabled: ${APP_AI_RAG_EVALUATION_ENTITY_ENHANCED_ENABLED:true}
        judgment-only: ${APP_AI_RAG_EVALUATION_JUDGMENT_ONLY:false}
        antimicrobial-summary-max-attempts: ${APP_AI_RAG_EVALUATION_ANTIMICROBIAL_SUMMARY_MAX_ATTEMPTS:3}
        antimicrobial-summary-source-experiment-id: ${APP_AI_RAG_EVALUATION_ANTIMICROBIAL_SUMMARY_SOURCE_EXPERIMENT_ID:b6aec474-a84c-48f6-8717-531042f09143}
        max-entity-terms: ${APP_AI_RAG_EVALUATION_MAX_ENTITY_TERMS:20}
        retrieval-scope: ${APP_AI_RAG_EVALUATION_RETRIEVAL_SCOPE:FULL_CORPUS}
        source-judgments-100-experiment-id: ${APP_AI_RAG_EVALUATION_SOURCE_JUDGMENTS_100_EXPERIMENT_ID:b6aec474-a84c-48f6-8717-531042f09143}
        source-judgments-1000-experiment-id: ${APP_AI_RAG_EVALUATION_SOURCE_JUDGMENTS_1000_EXPERIMENT_ID:9038d6bc-6213-4009-ae5e-d1bd45e0c4b8}
        review-entity-best-recall-enabled: ${APP_AI_RAG_EVALUATION_REVIEW_ENTITY_BEST_RECALL_ENABLED:true}
        review-entity-high-precision-enabled: ${APP_AI_RAG_EVALUATION_REVIEW_ENTITY_HIGH_PRECISION_ENABLED:false}
        review-entity-high-precision-query-marker: ${APP_AI_RAG_EVALUATION_REVIEW_ENTITY_HIGH_PRECISION_QUERY_MARKER:antibacterial}
        review-entity-best-recall-terms:
          - antibacterial compounds
          - Gram-positive bacteria
          - Gram-negative bacteria
          - resistant strains
          - mechanism of action
          - antibacterial activity
          - chemical classification
          - resistance development
          - therapeutic application
        document-rerank-max-documents: ${APP_AI_RAG_EVALUATION_DOCUMENT_RERANK_MAX_DOCUMENTS:0}
        document-rerank-max-chunks-per-document: ${APP_AI_RAG_EVALUATION_DOCUMENT_RERANK_MAX_CHUNKS_PER_DOCUMENT:5}
        document-rerank-max-document-chars: ${APP_AI_RAG_EVALUATION_DOCUMENT_RERANK_MAX_DOCUMENT_CHARS:7800}
        document-rerank-min-score: ${APP_AI_RAG_EVALUATION_DOCUMENT_RERANK_MIN_SCORE:0.5}
        rerank:
          enabled: ${APP_AI_RAG_EVALUATION_RERANK_ENABLED:false}
          endpoint: ${APP_AI_RAG_EVALUATION_RERANK_ENDPOINT:https://dashscope.aliyuncs.com/api/v1/services/rerank/text-rerank/text-rerank}
          api-key: ${DASHSCOPE_API_KEY:}
          model: ${APP_AI_RAG_EVALUATION_RERANK_MODEL:qwen3-vl-rerank}
          max-candidates: ${APP_AI_RAG_EVALUATION_RERANK_MAX_CANDIDATES:100}
    pretreatment:
      quality:
        min-chunks: ${APP_AI_PRETREATMENT_QUALITY_MIN_CHUNKS:3}
        min-total-text-chars: ${APP_AI_PRETREATMENT_QUALITY_MIN_TOTAL_TEXT_CHARS:1500}
        max-replacement-char-ratio: ${APP_AI_PRETREATMENT_QUALITY_MAX_REPLACEMENT_CHAR_RATIO:0.03}
        max-short-line-ratio: ${APP_AI_PRETREATMENT_QUALITY_MAX_SHORT_LINE_RATIO:0.80}
    review:
      enabled: true
      legacy-enabled: false
      async-threads: 2
      retrieval:
        seed-fts-max-results: 60
        seed-dense-max-results: 30
        seed-dense-min-score: 0.3
        auto-select-min-seed-score: 0.60
        seed-bm25-max-results: 40
        fused-max-results: 50
        max-candidates: 300
      report:
        max-tokens: 8000
        max-paper-table-iterations: 3
      reasoning:
        core-deep-thinking: true
        core-thinking-budget: 8192
        standard-deep-thinking: false
        standard-thinking-budget: 0
    evidence:
      enabled: ${APP_AI_EVIDENCE_ENABLED:true}
      async-threads: ${APP_AI_EVIDENCE_ASYNC_THREADS:2}
      chunk-batch-size: ${APP_AI_EVIDENCE_CHUNK_BATCH_SIZE:12}
      max-attempts: ${APP_AI_EVIDENCE_MAX_ATTEMPTS:3}
      max-single-pass-chunks: ${APP_AI_EVIDENCE_MAX_SINGLE_PASS_CHUNKS:40}
      max-single-pass-chars: ${APP_AI_EVIDENCE_MAX_SINGLE_PASS_CHARS:120000}
      output-root: ${APP_AI_EVIDENCE_OUTPUT_ROOT:Evidence}
      table:
        enabled: ${APP_AI_EVIDENCE_TABLE_ENABLED:true}
        enabled-question-ids: ${APP_AI_EVIDENCE_TABLE_ENABLED_QUESTION_IDS:Q1}
        llm-select: ${APP_AI_EVIDENCE_TABLE_LLM_SELECT:true}
        max-tables: ${APP_AI_EVIDENCE_TABLE_MAX_TABLES:6}
        max-table-chars: ${APP_AI_EVIDENCE_TABLE_MAX_CHARS:8000}
        recovery:
          enabled: ${APP_AI_EVIDENCE_TABLE_RECOVERY_ENABLED:true}
          max-recovered-tables: ${APP_AI_EVIDENCE_TABLE_RECOVERY_MAX_TABLES:3}
          max-chars: ${APP_AI_EVIDENCE_TABLE_RECOVERY_MAX_CHARS:12000}
      q1:
        prompt-only-markdown:
          enabled: ${APP_AI_EVIDENCE_Q1_PROMPT_ONLY_MARKDOWN:true}
      agents:
        constrained-decoding:
          enabled: ${APP_AI_EVIDENCE_CONSTRAINED_DECODING:false}
        verifier:
          enabled: ${APP_AI_EVIDENCE_VERIFIER:false}
          drop-invalid-rows: ${APP_AI_EVIDENCE_VERIFIER_DROP_INVALID:false}
        coverage:
          enabled: ${APP_AI_EVIDENCE_COVERAGE:false}
          max-recovery-rounds: ${APP_AI_EVIDENCE_COVERAGE_MAX_ROUNDS:1}
          max-candidates: ${APP_AI_EVIDENCE_COVERAGE_MAX_CANDIDATES:40}
        retriever:
          on-demand-enabled: ${APP_AI_EVIDENCE_RETRIEVER:false}
          max-chunks: ${APP_AI_EVIDENCE_RETRIEVER_MAX_CHUNKS:24}
          expand-parent-sections: ${APP_AI_EVIDENCE_RETRIEVER_EXPAND:1}
          prefer-tables-and-figures: ${APP_AI_EVIDENCE_RETRIEVER_PREFER_TABLES:true}
        reconciler:
          entity-linking-enabled: ${APP_AI_EVIDENCE_RECONCILER:false}
          enqueue-unknown-as-candidates: ${APP_AI_EVIDENCE_RECONCILER_ENQUEUE:true}
        telemetry:
          enabled: ${APP_AI_EVIDENCE_TELEMETRY:true}
    report:
      output-root: ${APP_AI_REPORT_OUTPUT_ROOT:tmp}
      source-experiment-id: ${APP_AI_REPORT_SOURCE_EXPERIMENT_ID:efe44f92-8d28-4902-bf77-a15d3bf14ee8}
      max-evidence: ${APP_AI_REPORT_MAX_EVIDENCE:50000}
      max-evidence-load: ${APP_AI_REPORT_MAX_EVIDENCE_LOAD:100000}
      max-model-evidence: ${APP_AI_REPORT_MAX_MODEL_EVIDENCE:80}
      max-direct-documents: ${APP_AI_REPORT_MAX_DIRECT_DOCUMENTS:15}
      max-supplemental-documents: ${APP_AI_REPORT_MAX_SUPPLEMENTAL_DOCUMENTS:5}
      retrieval-rounds: ${APP_AI_REPORT_RETRIEVAL_ROUNDS:2}
      max-queries-per-round: ${APP_AI_REPORT_MAX_QUERIES_PER_ROUND:8}
      dense-max-results: ${APP_AI_REPORT_DENSE_MAX_RESULTS:20}
      dense-min-score: ${APP_AI_REPORT_DENSE_MIN_SCORE:0.35}
      bm25-max-results: ${APP_AI_REPORT_BM25_MAX_RESULTS:30}
      fused-max-results: ${APP_AI_REPORT_FUSED_MAX_RESULTS:20}
      rrf-k: ${APP_AI_REPORT_RRF_K:60}
      chunks-per-analysis-batch: ${APP_AI_REPORT_CHUNKS_PER_ANALYSIS_BATCH:8}
      max-chars-per-analysis-batch: ${APP_AI_REPORT_MAX_CHARS_PER_ANALYSIS_BATCH:28000}
      analysis-batch-overlap: ${APP_AI_REPORT_ANALYSIS_BATCH_OVERLAP:1}
      max-document-analysis-attempts: ${APP_AI_REPORT_MAX_DOCUMENT_ANALYSIS_ATTEMPTS:2}
      min-report-chars: ${APP_AI_REPORT_MIN_REPORT_CHARS:3000}
      max-report-chars: ${APP_AI_REPORT_MAX_REPORT_CHARS:5000}
      async-threads: ${APP_AI_REPORT_ASYNC_THREADS:2}
    kg:
      enabled: true
      async-threads: 2
      entity-model: ${langchain4j.community.dashscope.chat-model.model-name:qwen3-max-2026-01-23}
      relation-model: ${langchain4j.community.dashscope.chat-model.model-name:qwen3-max-2026-01-23}
      schema-version: v1
      entity-confidence-threshold: 0.6
      relation-confidence-threshold: 0.6
      graph-max-results: 4
      graph-builder:
        enabled: false
        endpoint:
        model: ${langchain4j.community.dashscope.chat-model.model-name:qwen3-max-2026-01-23}
        batch-size: 1
        max-retries: 2
        connect-timeout-ms: 5000
        read-timeout-ms: 30000
