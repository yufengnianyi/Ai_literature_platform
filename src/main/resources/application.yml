spring:
  application:
    name: demo_01
  profiles:
    default: local
  flyway:
    placeholders:
      embeddingDimension: ${app.ai.rag.embedding-dimension:1024}
      vectorTable: ${app.ai.rag.vector-table:embedding_store}

server:
  port: 8081
  forward-headers-strategy: framework
  servlet:
    context-path: /api

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true

app:
  ai:
    memory:
      max-tokens: 4000
    rag:
      embedding-dimension: 1024
      vector-table: embedding_store
