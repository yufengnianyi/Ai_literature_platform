terms:
  # ── RLK core ──
  - canonical: "receptor-like kinase"
    aliases: ["RLK", "receptor like kinase", "receptor kinase", "RLKs"]
    related: ["LRR-RLK", "WAK", "PERK", "CRK", "LecRLK"]

  - canonical: "leucine-rich repeat receptor-like kinase"
    aliases: ["LRR-RLK", "LRR RLK", "LRR-RLKs", "LRR receptor kinase"]
    related: ["receptor-like kinase", "extracellular domain"]

  - canonical: "wall-associated kinase"
    aliases: ["WAK", "WAKs", "wall-associated receptor kinase"]
    related: ["receptor-like kinase", "cell wall"]

  - canonical: "cysteine-rich receptor-like kinase"
    aliases: ["CRK", "CRKs", "cysteine-rich RLK"]
    related: ["receptor-like kinase", "defense response"]

  - canonical: "lectin receptor-like kinase"
