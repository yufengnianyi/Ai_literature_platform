  - canonical: "S-domain receptor-like kinase"
    aliases: ["SDRLK", "S-domain RLK", "SD-RLK"]
    related: ["receptor-like kinase", "self-incompatibility"]

  - canonical: "proline-rich extensin-like receptor kinase"
    aliases: ["PERK", "PERKs"]
    related: ["receptor-like kinase"]

  # ── Domains & structure ──
  - canonical: "kinase domain"
    aliases: ["KD", "protein kinase domain", "catalytic domain"]
