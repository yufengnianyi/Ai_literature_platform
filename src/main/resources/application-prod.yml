spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}

langchain4j:
  community:
    dashscope:
      chat-model:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}
      embedding-model:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: ${DASHSCOPE_EMBEDDING_MODEL:text-embedding-v4}
      streaming-chat-model:
        api-key: ${DASHSCOPE_API_KEY}
        model-name: ${DASHSCOPE_CHAT_MODEL:qwen-max}

app:
  ai:
    rag:
      docs-path: /app/data/docs
      bootstrap-mode: ${APP_AI_RAG_BOOTSTRAP_MODE:if-empty}
  web:
    cors:
      allowed-origin-patterns: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:}

bigmodel:
  api-key: ${BIGMODEL_API_KEY:}
