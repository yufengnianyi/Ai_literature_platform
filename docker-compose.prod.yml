name: ai_literature

services:
  postgres:
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-demo_01}
      POSTGRES_USER: ${POSTGRES_USER:-demo_01}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-demo_01}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-demo_01} -d ${POSTGRES_DB:-demo_01}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - postgres-data:/var/lib/postgresql/data

  grobid:
    image: lfoppiano/grobid:0.8.2
    restart: unless-stopped

  neo4j:
    image: neo4j:5.26.22
    restart: unless-stopped
    environment:
      NEO4J_AUTH: ${NEO4J_AUTH:-neo4j/demo_01_graph}
    volumes:
      - neo4j-data:/data

  backend:
    image: ${BACKEND_IMAGE:-ai_literature-backend:latest}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        BACKEND_BUILD_IMAGE: ${BACKEND_BUILD_IMAGE:-maven:3.9.12-eclipse-temurin-21-alpine}
        BACKEND_RUNTIME_IMAGE: ${BACKEND_RUNTIME_IMAGE:-eclipse-temurin:21-jre-alpine}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_started
    environment:
      SPRING_PROFILES_ACTIVE: prod
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-demo_01}
      SPRING_DATASOURCE_USERNAME: ${POSTGRES_USER:-demo_01}
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD:-demo_01}
      DASHSCOPE_API_KEY: ${DASHSCOPE_API_KEY}
      DASHSCOPE_CHAT_MODEL: ${DASHSCOPE_CHAT_MODEL:-qwen3-max-2026-01-23}
      DASHSCOPE_EMBEDDING_MODEL: ${DASHSCOPE_EMBEDDING_MODEL:-text-embedding-v4}
      DASHSCOPE_ENABLE_THINKING: ${DASHSCOPE_ENABLE_THINKING:-true}
      DASHSCOPE_THINKING_BUDGET: ${DASHSCOPE_THINKING_BUDGET:-81920}
      BIGMODEL_API_KEY: ${BIGMODEL_API_KEY:-}
      APP_AI_RAG_GROBID_BASE_URL: ${APP_AI_RAG_GROBID_BASE_URL:-http://grobid:8070}
      APP_AI_KG_ENABLED: ${APP_AI_KG_ENABLED:-false}
      APP_AI_KG_GRAPH_BUILDER_ENABLED: ${APP_AI_KG_GRAPH_BUILDER_ENABLED:-false}
      APP_AI_KG_GRAPH_BUILDER_ENDPOINT: ${APP_AI_KG_GRAPH_BUILDER_ENDPOINT:-}
      SPRING_NEO4J_URI: ${SPRING_NEO4J_URI:-bolt://neo4j:7687}
      SPRING_NEO4J_USERNAME: ${SPRING_NEO4J_USERNAME:-neo4j}
      SPRING_NEO4J_PASSWORD: ${SPRING_NEO4J_PASSWORD:-demo_01_graph}
      APP_CORS_ALLOWED_ORIGIN_PATTERNS: ${APP_CORS_ALLOWED_ORIGIN_PATTERNS:-}

  web:
    image: ${WEB_IMAGE:-ai_literature-web:latest}
    build:
      context: ./ai-literature-frontend
      dockerfile: Dockerfile
      args:
        WEB_BUILD_IMAGE: ${WEB_BUILD_IMAGE:-node:24-alpine}
        WEB_RUNTIME_IMAGE: ${WEB_RUNTIME_IMAGE:-nginx:1.27-alpine}
        VITE_APP_BASE_PATH: ${VITE_APP_BASE_PATH:-/viteApp/}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-/viteApp/api}
    restart: unless-stopped
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8088}:80"

volumes:
  postgres-data:
  neo4j-data:
